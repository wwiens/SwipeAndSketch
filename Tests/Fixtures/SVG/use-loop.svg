<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" width="100mm" height="100mm">
  <defs>
    <g id="a"><rect width="10" height="10"/><use xlink:href="#b" x="20"/></g>
    <g id="b"><use xlink:href="#a" y="20"/></g>
    <symbol id="dot" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5"/></symbol>
  </defs>
  <use href="#a"/>
  <use href="#dot" x="60" y="60" width="20" height="20"/>
</svg>
